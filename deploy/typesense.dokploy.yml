services:
  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    environment:
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY}
      - TYPESENSE_ENABLE_CORS=${TYPESENSE_ENABLE_CORS}
      - TYPESENSE_DATA_DIR=/data
    volumes:
      - typesense-public-data:/data

  typesense-private:
    image: typesense/typesense:30.2
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_PRIVATE_BOOTSTRAP_KEY:?required}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: 'false'
      TYPESENSE_ENABLE_ACCESS_LOGGING: 'false'
      TYPESENSE_ENABLE_SEARCH_LOGGING: 'false'
      TYPESENSE_LOG_SLOW_REQUESTS_TIME_MS: '-1'
      CILAS_PRIVATE_READ_KEY: ${CILAS_PRIVATE_READ_KEY:?required}
      CILAS_PRIVATE_WRITE_KEY: ${CILAS_PRIVATE_WRITE_KEY:?required}
    volumes:
      - typesense-private-data:/data
    networks:
      cilas-search:
        aliases:
          - cilas-private-search
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/8108; printf "GET /health HTTP/1.0\r\n\r\n" >&3; head -1 <&3 | grep -q "200 OK"',
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  typesense-data:
  typesense-public-data:
    external: true
    name: cilas-typesense-public-302-data
  typesense-private-data:

networks:
  cilas-search:
    external: true
