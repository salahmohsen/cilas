# Installation is owned by scripts/install-commit-hooks.mjs, including the
# branch-safe dispatcher. Never replace it during `lefthook run`.
no_auto_install: true

pre-commit:
  parallel: false
  commands:
    lint-and-format:
      glob: '*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}'
      run: >-
        pnpm exec oxlint --fix --no-error-on-unmatched-pattern -- {staged_files}
        && pnpm exec oxfmt --write --no-error-on-unmatched-pattern -- {staged_files}
      stage_fixed: true
    format:
      glob: '*.{css,scss,less,json,jsonc,yaml,yml,md,mdx,html}'
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern -- {staged_files}
      stage_fixed: true
