services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: search_test
      POSTGRES_PASSWORD: disposable
      POSTGRES_DB: cilas_search_test
    ports:
      - '127.0.0.1:55439:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U search_test -d cilas_search_test']
      interval: 2s
      timeout: 2s
      retries: 30
  typesense:
    image: typesense/typesense:30.2
    command: '--data-dir=/data --api-key=disposable-search-test-key --enable-access-logging=false --enable-search-logging=false --log-slow-requests-time-ms=-1'
    ports:
      - '127.0.0.1:18109:8108'
    tmpfs:
      - /data
  storage:
    image: ${SEARCH_TEST_S3_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    command: 'server /data'
    environment:
      MINIO_ROOT_USER: local-test
      MINIO_ROOT_PASSWORD: local-test
    ports:
      - '127.0.0.1:19000:9000'
    tmpfs:
      - /data
